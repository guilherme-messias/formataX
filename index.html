<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormataX</title>
    <link
      rel="shortcut icon"
      href="./img/formataX-favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
    <script src="./src/index.js" type="module" defer></script>
  </head>
  <body>
    <header class="hero">
      <img src="./img/formataX-logo.png" alt="Logo do FormataX" id="img-logo" />
      <div class="hero__copy">
        <h1>FormataX</h1>
        <p>Formate textos com precisão, rapidez e clareza.</p>
      </div>
    </header>
    <main>
      <section id="formatOptions" class="panel">
        <h2>1. Selecione a personalização da sua formatação abaixo:</h2>
        <div class="checkbox-grid">
          <label class="checkbox-card" for="removeDots">
            <input
              type="checkbox"
              name="formatOption"
              id="removeDots"
              checked
            />
            <span class="checkbox-card__control" aria-hidden="true"></span>
            <span class="checkbox-card__text">
              <span class="checkbox-card__title">Excluir pontos</span>
              <span class="checkbox-card__description"
                >Remove os pontos do texto formatado.</span
              >
            </span>
          </label>

          <label class="checkbox-card" for="uppercase">
            <input type="checkbox" name="formatOption" id="uppercase" checked />
            <span class="checkbox-card__control" aria-hidden="true"></span>
            <span class="checkbox-card__text">
              <span class="checkbox-card__title">Maiúscula</span>
              <span class="checkbox-card__description"
                >Converte todo o conteúdo para letras maiúsculas.</span
              >
            </span>
          </label>

          <label class="checkbox-card" for="removeAccentsAndPunctuation">
            <input
              type="checkbox"
              name="formatOption"
              id="removeAccentsAndPunctuation"
              checked
            />
            <span class="checkbox-card__control" aria-hidden="true"></span>
            <span class="checkbox-card__text">
              <span class="checkbox-card__title"
                >Remover acentos e pontuação</span
              >
              <span class="checkbox-card__description"
                >Elimina acentos gráficos e sinais de pontuação.</span
              >
            </span>
          </label>

          <label class="checkbox-card" for="removeDashes">
            <input
              type="checkbox"
              name="formatOption"
              id="removeDashes"
              checked
            />
            <span class="checkbox-card__control" aria-hidden="true"></span>
            <span class="checkbox-card__text">
              <span class="checkbox-card__title">Remover traços</span>
              <span class="checkbox-card__description"
                >Exclui os traços do texto formatado.</span
              >
            </span>
          </label>
        </div>
      </section>

      <section id="textInput" class="panel">
        <h2>2. Insira o texto que deseja formatar no campo abaixo:</h2>
        <label for="textToFormat" class="field-label">Texto de entrada</label>
        <textarea id="textToFormat"></textarea>
        <div class="actions">
          <button id="autoFormatButton" class="btn btn-primary">
            Formatar
          </button>
          <button id="copyFormattedTextButton" class="btn btn-secondary">
            Copiar
          </button>
        </div>
      </section>

      <section
        id="formattedOutput"
        class="panel output-panel"
        aria-live="polite"
      >
        <label for="formattedText" class="field-label">Resultado:</label>
        <output id="formattedText" for="textToFormat"></output>
      </section>
    </main>
    <footer class="footer-links">
      <a
        href="https://github.com/guilherme-messias"
        target="_blank"
        rel="noreferrer"
        aria-label="GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 0 0-3.16 19.5c.5.09.68-.22.68-.48v-1.7c-2.76.6-3.34-1.15-3.34-1.15-.45-1.15-1.1-1.46-1.1-1.46-.9-.62.07-.61.07-.61 1 .07 1.53 1.04 1.53 1.04.88 1.52 2.3 1.08 2.87.83.09-.65.35-1.08.63-1.33-2.2-.25-4.52-1.1-4.52-4.89 0-1.08.38-1.96 1.03-2.65-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.4 9.4 0 0 1 5 0c1.9-1.29 2.74-1.02 2.74-1.02.56 1.37.21 2.39.11 2.64.64.69 1.02 1.57 1.02 2.65 0 3.8-2.32 4.63-4.53 4.88.36.31.68.92.68 1.86v2.76c0 .26.18.57.69.48A10 10 0 0 0 12 2Z"
          />
        </svg>
        <span>GitHub</span>
      </a>
      <a
        href="https://www.linkedin.com/in/guilhermemessiasdev/"
        target="_blank"
        rel="noreferrer"
        aria-label="LinkedIn"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6.94 6.5A1.94 1.94 0 1 1 3.06 6.5a1.94 1.94 0 0 1 3.88 0ZM3.5 9h3v12h-3V9Zm5 0h2.87v1.64h.04c.4-.76 1.4-1.55 2.9-1.55 3.1 0 3.67 2.04 3.67 4.7V21h-3v-6.1c0-1.46-.03-3.33-2.03-3.33-2.03 0-2.34 1.58-2.34 3.22V21h-3V9Z"
          />
        </svg>
        <span>LinkedIn</span>
      </a>
    </footer>
  </body>
</html>
